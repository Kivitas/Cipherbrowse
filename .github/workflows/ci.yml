name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        shell: pwsh
        working-directory: Main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

  # Runs live searches against third-party sites. Their pages and rate limits
  # change without notice, so this job is advisory: a failure shows in the run
  # but does not fail the workflow. The unit tests above are the gate.
  live-verify:
    name: live verify (advisory)
    if: github.event_name == 'push'
    needs: test
    continue-on-error: true
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Regression verify
        env:
          # Lets the GitHub search check use the runner's higher rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run verify
